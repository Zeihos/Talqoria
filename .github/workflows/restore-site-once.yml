name: One-time site restoration
on:
  push:
    branches: ['chore/repository-cleanup-20261117']
permissions:
  contents: write
jobs:
  restore:
    if: github.event.head_commit.message == 'chore: reorganize source tree and remove runtime artifacts'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Restore original site from archived repository version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/backup/pre-cleanup-20261117:refs/remotes/origin/backup/pre-cleanup-20261117
          git show "origin/backup/pre-cleanup-20261117:TALQORIA_v0.11_CLEAN.zip" > "$RUNNER_TEMP/original-site.zip"
          mkdir -p site tools
          unzip -j "$RUNNER_TEMP/original-site.zip" "TALQORIA/site/*" -d site
          unzip -j "$RUNNER_TEMP/original-site.zip" "TALQORIA/tools/preflight.js" -d tools
          test -s site/index.html
          test -s site/app.js
          test -s site/styles.css
          sed -i -e 's/0\.11/0.13/g' site/index.html
          sed -i -e 's/0\.11/0.13/g' site/app.js
          sed -i -e 's/0\\.11/0.13/g' tools/preflight.js
          git add site tools/preflight.js
          git rm .github/workflows/restore-site-once.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: restore original TALQORIA site and preflight tool'
          git push origin HEAD:chore/repository-cleanup-20261117
