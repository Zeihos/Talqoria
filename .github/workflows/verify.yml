name: Verify Talqoria
on:
  push:
    branches: [main, 'dev/**', 'chore/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    name: Node.js API and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public repository structure and documentation
        run: node tools/repo-check.js
      - name: Validate backend and website
        run: node --test backend/test/*.test.js
  plugin:
    name: Java storage and Paper API build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: plugin/pom.xml
      - name: Pure Java provenance regression tests
        run: |
          mkdir -p "$RUNNER_TEMP/talqoria-ledger-test"
          javac --release 21 -d "$RUNNER_TEMP/talqoria-ledger-test" \
            plugin/src/main/java/ru/talqoria/core/PlacedBlockLedger.java \
            plugin/src/main/java/ru/talqoria/core/AuditLedger.java \
            plugin/src/main/java/ru/talqoria/core/MarketJournal.java \
            plugin/src/main/java/ru/talqoria/core/OfflineInspector.java \
            plugin/src/test/java/ru/talqoria/core/PlacedBlockLedgerSelfTest.java \
            plugin/src/test/java/ru/talqoria/core/OfflineInspectorSelfTest.java
          java -cp "$RUNNER_TEMP/talqoria-ledger-test" ru.talqoria.core.PlacedBlockLedgerSelfTest
          java -cp "$RUNNER_TEMP/talqoria-ledger-test" ru.talqoria.core.OfflineInspectorSelfTest
      - name: Test wallet persistence with JUnit and build plugin
        run: mvn -B -ntp -f plugin/pom.xml clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: TalqoriaCore-dev
          path: plugin/target/talqoria-core-0.16.0.jar
          retention-days: 7
          if-no-files-found: error
