name: "Предложить улучшение"
description: "Идея для игрового процесса, сайта или инструментов"
title: "[Предложение] "
body:
  - type: dropdown
    id: area
    attributes:
      label: "Направление"
      options:
        - "Выживание и прогрессия"
        - "Поселения и приваты"
        - "Экономика и задания"
        - "Сайт и API"
        - "Администрирование"
        - "Другое"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Какую проблему решаем?"
      description: "Объясните, зачем это нужно игрокам или разработчикам."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Ваше предложение"
      description: "Опишите желаемое поведение, интерфейс или механику."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Альтернативы (если есть)"
