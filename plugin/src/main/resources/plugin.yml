name: TalqoriaCore
version: '0.14.0'
main: ru.talqoria.core.TalqoriaCorePlugin
api-version: '1.21.11'
description: TALQORIA survival quests, starter journey, guarded alpha market, towns, claims, economy and site status bridge
author: TALQORIA
commands:
  tq:
    description: Main Talqoria commands
    usage: /tq help
    aliases: [talqoria]
permissions:
  talqoria.admin:
    description: Allows setting the spawn location
    default: op
  talqoria.claims.bypass:
    description: Allows staff to edit any claimed chunk (requires trusted operators)
    default: op
  talqoria.staff.status:
    description: Shows plugin diagnostics to staff
    default: op
  talqoria.staff.inspect:
    description: Read-only inspection of online player info with audit log
    default: op
  talqoria.staff.audit:
    description: Read last five verified staff audit entries
    default: op
  talqoria.staff.market:
    description: Inspect and resolve unresolved market transactions (console-only resolution)
    default: op
